<main id="main-content" role="main">
    <div class="view-tabs" role="tablist" aria-label="Secciones">
        <button class="tab-btn active" data-view="tasks" role="tab" aria-selected="true">
            <span data-icon="list" data-size="16"></span> Tareas
        </button>
        <button class="tab-btn" data-view="stats" role="tab" aria-selected="false">
            <span data-icon="chart" data-size="16"></span> Estadísticas
        </button>
    </div>

    <section id="view-tasks" class="view active" role="tabpanel" aria-label="Tareas">
        <section class="search-filter">
            <input type="text" id="search-input" placeholder="Buscar tareas..." aria-label="Buscar tareas">
            <select id="filter-select" aria-label="Filtrar por estado">
                <option value="all">Todas las tareas</option>
                <option value="Pendiente">Pendientes</option>
                <option value="En Progreso">En Progreso</option>
                <option value="Completada">Completadas</option>
            </select>
        </section>

        <input type="file" id="import-input" accept=".json" hidden>

        <section id="category-content" class="category-content" aria-label="Contenido de la categoría seleccionada"></section>
    </section>

    <section id="view-stats" class="view" role="tabpanel" aria-label="Estadísticas">
        <section id="stats" class="stats-section" aria-label="Estadísticas de tareas"></section>
    </section>

    <footer class="app-footer">
        <p>&copy; 2026 Anotador de Tareas Profesionales. Datos guardados en tu navegador (localStorage).</p>
    </footer>
</main>
