<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotador de Tareas Profesionales</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loader.css?v=3">
    <link rel="stylesheet" href="css/loader-anim.css?v=3">
    <link rel="stylesheet" href="css/base.css?v=3">
    <link rel="stylesheet" href="css/sidebar.css?v=3">
    <link rel="stylesheet" href="css/main.css?v=3">
    <link rel="stylesheet" href="css/category.css?v=3">
    <link rel="stylesheet" href="css/tasks.css?v=3">
    <link rel="stylesheet" href="css/stats.css?v=3">
    <link rel="stylesheet" href="css/insights.css?v=3">
    <link rel="stylesheet" href="css/tabs.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/animations.css?v=3">
</head>
<body>
    <div id="loader" class="loader" role="status" aria-live="polite" aria-label="Cargando el anotador de tareas">
        <div class="loader-bar"><i id="loader-progress"></i></div>
        <div class="loader-stage">
            <div class="loader-jump">
                <svg class="loader-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                    <rect x="8" y="2" width="8" height="4" rx="1"/>
                    <path d="M9 12h6M9 16h4"/>
                </svg>
                <span class="loader-shadow" aria-hidden="true"></span>
            </div>
            <p class="loader-title">Anotador de Tareas</p>
            <p class="loader-status" id="loader-status">Preparando tu tablero</p>
        </div>
    </div>

    <div id="app">
        <div id="partial-header"></div>
        <div class="workspace">
            <div id="partial-sidebar"></div>
            <div id="partial-main"></div>
        </div>
    </div>

    <script src="js/icons.js?v=3"></script>
    <script src="js/loader.js?v=3"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/render.js?v=3"></script>
    <script src="js/tasks.js?v=3"></script>
    <script src="js/categories.js?v=3"></script>
    <script src="js/io.js?v=3"></script>
    <script src="js/stats.js?v=3"></script>
    <script src="js/stats-view.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
    <script src="js/partials.js?v=3"></script>
</body>
</html>
