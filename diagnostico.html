<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico de animaciones</title>
    <link rel="stylesheet" href="css/base.css?v=3">
    <link rel="stylesheet" href="css/loader.css?v=3">
    <link rel="stylesheet" href="css/loader-anim.css?v=3">
    <style>
        body { padding: 40px; font-family: 'Roboto', sans-serif; }
        h1 { color: #FFD700; font-size: 1.4rem; margin-bottom: 20px; }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; margin-bottom: 10px;
            background: #161616; border: 1px solid #333; border-radius: 8px;
        }
        .ok { color: #6EE7B7; font-weight: 700; }
        .bad { color: #F59E0B; font-weight: 700; }
        code { color: #B0B0B0; font-size: 0.8rem; }
        .fix {
            margin-top: 24px; padding: 16px 20px;
            background: rgba(255,215,0,0.07);
            border-left: 3px solid #FFD700; border-radius: 6px;
            color: #E8E8E8; font-size: 0.9rem; line-height: 1.7;
        }
        a { color: #FFD700; }
    </style>
</head>
<body>
    <h1>Diagnóstico de animaciones</h1>
    <div id="out"></div>
    <div class="fix" id="fix"></div>
    <script>
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const noPref = matchMedia('(prefers-reduced-motion: no-preference)').matches;
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const loaderCSS = [...document.styleSheets].find(s => (s.href || '').includes('loader.css'));
        let hasHop = false;
        try {
            hasHop = [...loaderCSS.cssRules].some(r => r.name === 'loaderHop');
        } catch (e) { hasHop = false; }

        const rows = [
            ['prefers-reduced-motion: reduce', reduce ? 'ACTIVO' : 'inactivo', reduce],
            ['prefers-reduced-motion: no-preference', noPref ? 'ACTIVO' : 'inactivo', noPref],
            ['CSS loader.css tiene @keyframes loaderHop', hasHop ? 'SI' : 'NO', hasHop],
            ['loader.css cargado desde', loaderCSS ? loaderCSS.href : 'no', true]
        ];

        document.getElementById('out').innerHTML = rows.map(r =>
            `<div class="row"><span class="${r[2] ? 'ok' : 'bad'}">${r[1]}</span><code>${r[0]}</code></div>`
        ).join('');

        document.getElementById('fix').innerHTML = reduce
            ? '<b>Tu sistema tiene las animaciones en OFF.</b><br>Windows: <b>Configuración → Accesibilidad → Efectos visuales → Animaciones</b> → activar.<br>Después recargá la app con <b>Ctrl+Shift+R</b>.'
            : (hasHop
                ? '<b>Todo OK.</b> Las animaciones están habilitadas y el CSS nuevo está cargado. Si igual no se anima, hacé <b>Ctrl+Shift+R</b> (fuerza el cache) y recargá la app.'
                : '<b>El CSS viejo está en el caché.</b> Hacé <b>Ctrl+Shift+R</b> en la app (hard reload) para forzar a bajar la versión nueva.');
    </script>
</body>
</html>
